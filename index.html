<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookofJarv | Jarvis Anderson</title>
  <meta name="description" content="BookofJarv — Jarvis Anderson's documented journey from help desk to network engineering, sharing labs, automation work, technical growth, and the mission behind KodeKouncil." />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    /* ── Reset & Base ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --surface2:  #1c2330;
      --border:    #30363d;
      --accent:    #58a6ff;
      --accent2:   #3fb950;
      --gold:      #e3b341;
      --linkedin:  #0a66c2;
      --youtube:   #ff0000;
      --instagram: #e1306c;
      --github:    #f0f6fc;
      --text:      #e6edf3;
      --muted:     #8b949e;
      --radius:    10px;
      --radius-lg: 16px;
      --transition: 0.25s ease;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* ── Scroll-reveal ──────────────────────────────────────────── */
    .reveal {
      opacity: 0;
      transform: translateY(32px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .reveal-left {
      opacity: 0;
      transform: translateX(-40px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .reveal-left.visible { opacity: 1; transform: translateX(0); }
    .reveal-right {
      opacity: 0;
      transform: translateX(40px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .reveal-right.visible { opacity: 1; transform: translateX(0); }

    /* ── Navigation ─────────────────────────────────────────────── */
    nav {
      position: sticky;
      top: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 64px;
      background: rgba(13, 17, 23, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-brand {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.03em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      list-style: none;
    }

    .nav-links a {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.85rem;
      border-radius: var(--radius);
      font-size: 0.88rem;
      color: var(--muted);
      transition: color var(--transition), background var(--transition);
    }

    .nav-links a:hover { color: var(--text); background: var(--surface); }

    .nav-linkedin {
      display: flex !important;
      align-items: center;
      gap: 0.45rem;
      padding: 0.5rem 1rem !important;
      background: var(--linkedin) !important;
      color: #fff !important;
      border-radius: var(--radius) !important;
      font-weight: 600;
      font-size: 0.9rem !important;
      box-shadow: 0 0 16px rgba(10, 102, 194, 0.5);
      transition: background var(--transition), box-shadow var(--transition), transform 0.15s !important;
      border: 2px solid rgba(255,255,255,0.15);
    }

    .nav-linkedin:hover {
      background: #0958a8 !important;
      box-shadow: 0 0 26px rgba(10, 102, 194, 0.8) !important;
      transform: translateY(-1px);
    }

    /* ── Hamburger ──────────────────────────────────────────────── */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 0.4rem;
      border: none;
      background: none;
      color: var(--text);
    }
    .hamburger span {
      display: block;
      width: 22px;
      height: 2px;
      background: var(--text);
      border-radius: 2px;
      transition: var(--transition);
    }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .mobile-menu {
      display: none;
      position: fixed;
      top: 64px;
      left: 0;
      right: 0;
      background: rgba(13, 17, 23, 0.97);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      z-index: 190;
      flex-direction: column;
      gap: 0.5rem;
    }
    .mobile-menu.open { display: flex; }
    .mobile-menu a {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.65rem 0.75rem;
      border-radius: var(--radius);
      color: var(--muted);
      font-size: 0.95rem;
      transition: color var(--transition), background var(--transition);
    }
    .mobile-menu a:hover { color: var(--text); background: var(--surface); }

    /* ── Section base ───────────────────────────────────────────── */
    .section-wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 5rem 1.5rem;
    }

    .section-label {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    .section-title {
      font-size: clamp(1.6rem, 3.5vw, 2.4rem);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1rem;
    }

    .section-sub {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 640px;
      margin-bottom: 2.5rem;
    }

    /* ── Hero with Image Layout ─────────────────────────────────── */
    #hero {
      min-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 4rem 1.5rem;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 85% 62% at 50% 0%, rgba(88,166,255,0.18) 0%, rgba(88,166,255,0.04) 42%, transparent 75%),
        radial-gradient(ellipse 65% 46% at 82% 84%, rgba(63,185,80,0.1) 0%, rgba(63,185,80,0.03) 38%, transparent 66%),
        radial-gradient(ellipse 55% 38% at 14% 74%, rgba(227,179,65,0.08) 0%, rgba(227,179,65,0.02) 45%, transparent 72%),
        linear-gradient(180deg, rgba(13,17,23,0.35) 0%, rgba(13,17,23,0.7) 70%, rgba(13,17,23,0.9) 100%);
      pointer-events: none;
    }

    .hero-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: center;
      position: relative;
      z-index: 1;
      max-width: 1200px;
    }

    .hero-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-image-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-image {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 7 / 10;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(88, 166, 255, 0.2);
      object-fit: cover;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .hero-eyebrow {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .hero-title {
      font-size: clamp(2rem, 5vw, 3.4rem);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 1rem;
    }

    .hero-title span { color: var(--accent); }

    .hero-desc {
      color: var(--muted);
      font-size: 1.1rem;
      max-width: 500px;
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .hero-ctas {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
    }

    .hero-cta-note {
      margin-top: 0.8rem;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.4rem;
      background: var(--accent);
      color: #0d1117;
      border-radius: var(--radius);
      font-weight: 700;
      font-size: 0.95rem;
      transition: background var(--transition), transform 0.15s, box-shadow var(--transition);
      box-shadow: 0 0 20px rgba(88,166,255,0.3);
    }
    .btn-primary:hover {
      background: #79b8ff;
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(88,166,255,0.55);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.4rem;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 0.95rem;
      transition: border-color var(--transition), background var(--transition), transform 0.15s;
    }
    .btn-secondary:hover {
      border-color: var(--accent);
      background: rgba(88,166,255,0.08);
      transform: translateY(-2px);
    }

    /* ── Quick Stats ─────────────────────────────────────────────── */
    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 2.5rem;
      padding-top: 2.5rem;
      border-top: 1px solid var(--border);
    }

    .stat-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem;
    }

    .stat-item h4 {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.3rem;
    }

    .stat-item p {
      color: var(--text);
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .stat-item small {
      display: block;
      margin-top: 0.25rem;
      color: var(--muted);
      font-size: 0.78rem;
    }

    /* ── Spotlight cards (bookofjarv / kodekouncil) ─────────────── */
    .spotlight-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-top: 2.5rem;
    }

    .spotlight-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      position: relative;
      overflow: hidden;
      transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
    }

    .spotlight-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
    }

    .spotlight-card.jarv::before  { background: linear-gradient(90deg, #58a6ff, #3fb950); }
    .spotlight-card.kouncil::before { background: linear-gradient(90deg, #e3b341, #f78166); }

    .spotlight-card:hover {
      border-color: var(--accent);
      box-shadow: 0 8px 40px rgba(88,166,255,0.12);
      transform: translateY(-4px);
    }
    .spotlight-card.kouncil:hover {
      border-color: var(--gold);
      box-shadow: 0 8px 40px rgba(227,179,65,0.12);
    }

    .spotlight-icon {
      font-size: 2.2rem;
      margin-bottom: 1rem;
    }

    .spotlight-card h3 {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      color: var(--accent);
    }
    .spotlight-card.kouncil h3 { color: var(--gold); }

    .spotlight-card p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.65;
      margin-bottom: 1rem;
    }

    .spotlight-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1.25rem;
    }

    .tag {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.65rem;
      border-radius: 20px;
      background: rgba(88,166,255,0.12);
      color: var(--accent);
      border: 1px solid rgba(88,166,255,0.25);
    }
    .tag.gold {
      background: rgba(227,179,65,0.12);
      color: var(--gold);
      border-color: rgba(227,179,65,0.25);
    }
    .tag.green {
      background: rgba(63,185,80,0.12);
      color: var(--accent2);
      border-color: rgba(63,185,80,0.25);
    }

    .spotlight-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--accent);
      transition: gap var(--transition);
    }
    .spotlight-link:hover { gap: 0.7rem; }
    .spotlight-card.kouncil .spotlight-link { color: var(--gold); }

    /* ── Mission & Focus ──────────────────────────────────────────── */
    .mission-grid,
    .journey-details,
    .focus-grid,
    .services-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.5rem;
    }

    .mission-panel,
    .journey-panel,
    .focus-card,
    .service-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
    }

    .mission-panel h3,
    .journey-panel h3,
    .focus-card h3,
    .service-card h3 {
      font-size: 1.1rem;
      margin-bottom: 0.85rem;
    }

    .mission-panel p,
    .journey-panel p,
    .focus-card p,
    .service-card p {
      color: var(--muted);
    }

    .mission-points,
    .focus-list,
    .service-list,
    .proof-list {
      list-style: none;
      display: grid;
      gap: 0.8rem;
      margin-top: 1rem;
    }

    .mission-points li,
    .focus-list li,
    .service-list li,
    .proof-list li {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      color: var(--muted);
    }

    .mission-points i,
    .focus-list i,
    .service-list i,
    .proof-list i {
      color: var(--accent);
      margin-top: 0.2rem;
    }

    .focus-card,
    .service-card {
      transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition);
    }

    .focus-card:hover,
    .service-card:hover,
    .journey-panel:hover,
    .mission-panel:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 10px 32px rgba(88,166,255,0.12);
    }

    .proof-list a {
      color: var(--text);
      font-weight: 600;
    }

    .proof-list a:hover {
      color: var(--accent);
    }

    /* ── Journey timeline strip ─────────────────────────────────── */
    .timeline-strip {
      display: flex;
      gap: 0;
      overflow-x: auto;
      padding: 1.5rem 0 0.5rem;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .timeline-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 160px;
      position: relative;
    }

    .timeline-step:not(:last-child)::after {
      content: '';
      position: absolute;
      top: 22px;
      left: calc(50% + 22px);
      width: calc(100% - 44px);
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--border));
    }

    .timeline-dot {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      margin-bottom: 0.75rem;
      position: relative;
      z-index: 1;
    }

    .timeline-step.active .timeline-dot {
      background: var(--accent);
      color: #0d1117;
      box-shadow: 0 0 16px rgba(88,166,255,0.5);
    }

    .timeline-step span {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
    }
    .timeline-step.active span { color: var(--accent); }

    /* ── Projects Section ──────────────────────────────────────── */
    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .filter-tab {
      padding: 0.4rem 1rem;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
    }
    .filter-tab:hover { border-color: var(--accent); color: var(--accent); }
    .filter-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0d1117;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
      align-items: start;
    }

    .project-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
      isolation: isolate;
    }

    .project-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 48px rgba(0,0,0,0.4);
      border-color: var(--accent);
      z-index: 3;
    }

    .project-card-inner {
      padding: 1.5rem;
    }

    .project-card-icon {
      font-size: 2rem;
      margin-bottom: 0.75rem;
    }

    .project-card h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      color: var(--text);
    }

    .project-card-desc {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 0.75rem;
    }

    .project-card-tag {
      display: inline-flex;
      align-items: center;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      background: rgba(88,166,255,0.1);
      color: var(--accent);
      border: 1px solid rgba(88,166,255,0.2);
      margin-bottom: 0.75rem;
    }

    .project-overlay {
      position: absolute;
      left: 0;
      right: 0;
      top: 100%;
      margin-top: 0.4rem;
      background:
        radial-gradient(circle at 88% 14%, rgba(88,166,255,0.18) 0%, transparent 48%),
        linear-gradient(160deg, rgba(22,27,34,0.98) 0%, rgba(13,17,23,0.98) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 1.25rem;
      border: 1px solid rgba(88,166,255,0.28);
      border-radius: 12px;
      box-shadow: 0 20px 42px rgba(0,0,0,0.45);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
      max-height: 320px;
      overflow-y: auto;
      z-index: 4;
    }

    .project-card:hover .project-overlay {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .project-overlay h4 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .project-overlay p {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 0.85rem;
    }

    .project-overlay-meta {
      list-style: none;
      display: grid;
      gap: 0.45rem;
      margin: 0 0 1rem;
    }

    .project-overlay-meta li {
      font-size: 0.8rem;
      color: var(--text);
      line-height: 1.45;
    }

    .project-overlay-meta strong {
      color: var(--accent);
    }

    .project-overlay-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .overlay-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.85rem;
      border-radius: var(--radius);
      font-size: 0.82rem;
      font-weight: 700;
      background: var(--accent);
      color: #0d1117;
      transition: background var(--transition);
    }
    .overlay-btn:hover { background: #79b8ff; }
    .overlay-btn.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .overlay-btn.ghost:hover { border-color: var(--accent); color: var(--accent); }

    .card-featured {
      position: absolute;
      top: 1rem; right: 1rem;
      background: var(--gold);
      color: #0d1117;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
    }

    .project-card[data-hidden="true"] {
      display: none;
    }

    /* ── Contact ─────────────────────────────────────────────────── */
    #contact .section-wrap {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .social-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-top: 2rem;
    }

    .social-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65rem;
      padding: 1.5rem 1.75rem;
      border-radius: var(--radius-lg);
      border: 2px solid transparent;
      min-width: 140px;
      font-weight: 600;
      font-size: 0.9rem;
